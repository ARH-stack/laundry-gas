<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laundry</title>
<meta name="theme-color" content="#ECEFFB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧺%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKEN DESAIN: Neumorphism ungu-biru solid + putih ============ */
:root{
  color-scheme:light;
  --bg:#ECEFFB; --hi:#FFFFFF; --lo:#C6CBE6;
  --ink:#25254F; --mute:#5F6390;
  --pri:#5A4FE5; --pri-d:#4338CA; --pri-soft:#DDDCFA;
  --ok:#1B8062; --warn:#946000; --bad:#B8324F;
  --raise:7px 7px 16px var(--lo),-7px -7px 16px var(--hi);
  --raise-s:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);
  --inset:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi);
  --f-head:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--pri-d)}
small,.muted{color:var(--mute)}
small{font-size:.85rem}
:focus-visible{outline:3px solid var(--pri);outline-offset:3px;border-radius:12px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.stack>*+*{margin-top:18px}
.row{display:flex;align-items:center;flex-wrap:wrap}
.gap{gap:12px}.between{justify-content:space-between}
.grid{display:grid;gap:18px}
.cards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.hide{display:none!important}

/* permukaan */
.card{background:var(--bg);border-radius:22px;box-shadow:var(--raise);padding:22px}
.card.sm{padding:16px;border-radius:18px;box-shadow:var(--raise-s)}
.inset{background:var(--bg);border-radius:16px;box-shadow:var(--inset);padding:14px}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;text-decoration:none;
  background:var(--bg);color:var(--ink);font-weight:700;padding:12px 22px;border-radius:16px;min-height:46px;
  box-shadow:var(--raise-s);transition:box-shadow .15s,transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{box-shadow:var(--inset);transform:none}
.btn.primary{background:var(--pri);color:#fff;box-shadow:5px 5px 12px rgba(90,79,229,.35),-4px -4px 10px var(--hi)}
.btn.primary:active{box-shadow:inset 3px 3px 8px rgba(0,0,0,.28)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:38px;padding:8px 14px;border-radius:13px;font-size:.9rem}
.btn[disabled]{opacity:.55;pointer-events:none}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* input */
label.f{display:block;font-weight:600;font-size:.9rem}
label.f>span{display:block;margin-bottom:6px}
.in,select.in,textarea.in{width:100%;border:0;background:var(--bg);box-shadow:var(--inset);border-radius:14px;padding:12px 14px;min-height:46px}
textarea.in{min-height:80px;resize:vertical}
.in::placeholder{color:#8A8EB3}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.opt{position:relative;cursor:pointer;display:block}
.opt input{position:absolute;opacity:0;inset:0}
.opt>span{display:block;padding:14px;border-radius:16px;background:var(--bg);box-shadow:var(--raise-s);transition:box-shadow .15s,background .15s}
.opt small{display:block}
.opt input:checked+span{box-shadow:var(--inset);background:var(--pri-soft)}
.opt input:focus-visible+span{outline:3px solid var(--pri);outline-offset:2px}
.sw{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--pri)}

/* badge & chip */
.chip,.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--bg);box-shadow:var(--inset);white-space:nowrap}
.b-new{color:var(--warn)}.b-proc{color:var(--pri-d)}.b-ready{color:#1D6FA5}.b-done,.b-ok{color:var(--ok)}.b-bad{color:var(--bad)}
.fchip{border:0;cursor:pointer;background:var(--bg);box-shadow:var(--raise-s);padding:8px 14px;border-radius:999px;font-weight:600;font-size:.85rem;white-space:nowrap}
.fchip[aria-pressed=true]{box-shadow:var(--inset);color:var(--pri-d)}

/* header pelanggan */
.top{padding:16px 0}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font:800 1.15rem var(--f-head);text-decoration:none;color:var(--ink)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a{padding:9px 16px;border-radius:14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.92rem}
.nav a[aria-current=page]{box-shadow:var(--inset);color:var(--pri-d)}
.nav a:hover{box-shadow:var(--raise-s)}
.nav a[aria-current=page]:hover{box-shadow:var(--inset)}
footer{padding:36px 0 48px;text-align:center}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;padding:28px 0 36px}
.hero .lead{font-size:1.15rem;color:var(--mute);margin:14px 0 22px;max-width:46ch}
.hero .chips{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.drum{width:min(260px,70vw);aspect-ratio:1;border-radius:50%;box-shadow:var(--raise);padding:22px;margin:auto;background:var(--bg)}
.drum-in{width:100%;height:100%;border-radius:50%;box-shadow:var(--inset);overflow:hidden;position:relative;background:var(--bg)}
.wave{position:absolute;left:0;bottom:0;width:200%;height:62%;animation:wave 7s linear infinite}
.wave.b{height:55%;opacity:.45;animation-duration:11s;animation-direction:reverse}
@keyframes wave{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.wave{animation:none}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.drum{order:-1;width:170px}}
section.blk{padding:18px 0}
section.blk>h2{margin-bottom:16px}
.svc{display:flex;flex-direction:column;gap:6px}
.price{font:800 1.5rem var(--f-head);color:var(--pri-d)}
.ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ul li{display:flex;gap:10px;align-items:flex-start}
.ul .icon{color:var(--pri);margin-top:3px}

/* ringkasan biaya */
.sum{display:grid;gap:8px}
.sum>div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{border-top:2px solid var(--lo);padding-top:10px;font-weight:800;font-size:1.1rem}

/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid var(--lo);display:grid;gap:14px}
.tl li{position:relative}
.tl li::before{content:'';position:absolute;left:-26px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--lo)}
.tl li:first-child::before{background:var(--pri)}

/* admin */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{display:block;padding:0 10px 18px}
.side a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;text-decoration:none;color:var(--ink);font-weight:600;margin-bottom:8px}
.side a:hover{box-shadow:var(--raise-s)}
.side a[aria-current=page]{box-shadow:var(--inset);color:var(--pri-d)}
.mainc{padding:24px 24px 90px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.stat b{display:block;font:800 1.6rem var(--f-head);color:var(--pri-d);margin-top:2px}
.stat.lg b{font-size:1.25rem}
.orow{display:grid;grid-template-columns:1.4fr auto auto auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--bg);
  box-shadow:var(--raise-s);border-radius:16px;padding:14px 16px;cursor:pointer;margin-bottom:12px}
.orow:active{box-shadow:var(--inset)}
.orow b{display:block}
.amt{font-weight:800;text-align:right}
.scroll{overflow-x:auto}
.scroll .chips{display:flex;gap:10px;padding:6px 4px 14px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--lo);white-space:nowrap}
th{color:var(--mute);font-weight:600}
.chart{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.chart>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:.75rem;color:var(--mute)}
.chart i{display:block;width:100%;max-width:34px;background:var(--pri);border-radius:10px 10px 4px 4px;min-height:4px}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:20;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));
    display:flex;gap:6px;overflow-x:auto;box-shadow:0 -6px 16px var(--lo);background:var(--bg)}
  .side .brand{display:none}
  .side a{flex-direction:column;gap:2px;font-size:.7rem;padding:8px 12px;margin:0;flex:none}
  .mainc{padding:16px 14px 110px}
  .orow{grid-template-columns:1fr auto}
  .orow .amt{text-align:left}
}

/* modal, toast, skeleton */
.ov{position:fixed;inset:0;background:rgba(37,37,79,.35);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 14px 24px;overflow:auto}
.modal{width:min(720px,100%);margin:auto 0;position:relative}
.modal.narrow{width:min(520px,100%)}
.x{position:absolute;top:14px;right:14px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--pri-d);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;box-shadow:var(--raise);max-width:90vw}
.toast.err{background:var(--bad)}
.sk{height:78px;border-radius:18px;box-shadow:var(--inset);animation:pulse 1.4s ease-in-out infinite;margin-bottom:14px}
@keyframes pulse{50%{opacity:.5}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
.empty{text-align:center;padding:30px 12px;color:var(--mute)}
.err-box{color:var(--bad);font-weight:600}

/* nota */
.nota{background:#fff;color:#222;border-radius:16px;padding:22px;font-size:.92rem;box-shadow:var(--inset)}
.nota h3{text-align:center}
.nota .c{text-align:center;color:#555;font-size:.85rem}
.nota hr{border:0;border-top:1px dashed #aaa;margin:12px 0}
.nota .sum>div{font-size:.9rem}
@media print{
  body *{visibility:hidden}
  #nota,#nota *{visibility:visible}
  #nota{position:absolute;left:0;top:0;width:100%;box-shadow:none}
}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Aplikasi ini membutuhkan JavaScript.</noscript>

<script>
/* =====================================================================
   KONFIGURASI — ganti dengan URL Web App Apps Script kamu
   (hasil Deploy > New deployment, berakhiran /exec)
   ===================================================================== */
const CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbz1ZyYY4WPORdNwrSduPsBibGPAHxAVKPk_tC1CZKE0BLPZA49FHssuVF2BqYlr8B_UYw/exec' };

/* ============================ UTIL ============================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N = v => Number(v) || 0;
const B = v => String(v).toUpperCase() === 'TRUE';
const rp = n => 'Rp' + Math.round(N(n)).toLocaleString('id-ID');
const kg = n => (Math.round(N(n) * 100) / 100).toLocaleString('id-ID') + ' kg';
const tgl = s => { const m = String(s || '').match(/(\d{4})-(\d{2})-(\d{2})/); if (!m) return s ? esc(s) : '-';
  return new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'}); };
const tglJam = s => tgl(s) + ((String(s).match(/(\d{2}:\d{2})/) || [])[1] ? ', ' + String(s).match(/(\d{2}:\d{2})/)[1] : '');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const waLink = (p, t) => 'https://wa.me/' + String(p || '').replace(/\D/g,'') + '?text=' + encodeURIComponent(t || '');
const normWa = v => { let d = String(v || '').replace(/\D/g,''); if (d.startsWith('0')) d = '62' + d.slice(1); else if (d.startsWith('8')) d = '62' + d; return d; };

const ICONS = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 010 7M18 14.3c2.2.6 3.5 2.4 3.5 5.7"/>',
  tag:'<path d="M3 12V4a1 1 0 011-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/>',
  truck:'<path d="M2 6h11v10H2zM13 9h4l4 4v3h-8z"/><circle cx="6.5" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  wallet:'<path d="M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2zM3 7l12-3v3"/><circle cx="16" cy="13.5" r="1"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', check:'<path d="M5 12l5 5 9-10"/>',
  print:'<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/>', chat:'<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>',
  out:'<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>'
};
const ico = n => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

const statusCls = s => /Menunggu/.test(s) ? 'b-new' : /Siap|Pengantaran/.test(s) ? 'b-ready' : s === 'Selesai' ? 'b-done' : s === 'Dibatalkan' ? 'b-bad' : 'b-proc';
const payCls = s => s === 'Lunas' ? 'b-ok' : s === 'DP' ? 'b-new' : 'b-bad';
const stBadge = s => `<span class="badge ${statusCls(s)}">${esc(s)}</span>`;
const pyBadge = s => `<span class="badge ${payCls(s)}">${esc(s)}</span>`;
const STATUSES = ['Menunggu Konfirmasi','Menunggu Penjemputan','Diterima','Dicuci','Dikeringkan','Disetrika','Siap Diambil','Dalam Pengantaran','Selesai','Dibatalkan'];

function toast(msg, err) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role', err ? 'alert' : 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3800);
}
const skeleton = (n = 4) => Array.from({length: n}, () => '<div class="sk"></div>').join('');

/* ============================ API ============================ */
const S = { info: null, token: store.get('lt') || '', list: { status: '', q: '' }, rep: null };
async function api(action, data) {
  if (!/^https:\/\//.test(CONFIG.API_URL)) throw new Error('API_URL belum diisi. Buka index.html dan isi CONFIG.API_URL dengan URL Web App.');
  let res;
  try {
    res = await fetch(CONFIG.API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: S.token, data: data || {} }) });
  } catch (e) { throw new Error('Tidak bisa terhubung ke server. Periksa internet atau pengaturan deploy.'); }
  let j; try { j = await res.json(); } catch (e) { throw new Error('Respons server tidak dikenali. Pastikan deploy diatur "Anyone".'); }
  if (!j.ok) { if (j.code === 'AUTH') { S.token = ''; store.del('lt'); if (/admin/.test(location.hash)) location.hash = '#/admin'; } throw new Error(j.message); }
  return j.data;
}

/* ============================ BIAYA (sama dengan server) ============================ */
const feeFor = (t, kind, w) => (B(t[kind+'_gratis']) && w >= N(t[kind+'_min_kg']) && w > 0) ? 0 : N(t[kind+'_biaya']);
function estimate(t, svc, w, terima, kembali) {
  if (!svc) return null;
  const layanan = Math.round(Math.max(w, N(svc.MinBerat)) * N(svc.HargaPerKg));
  const pick = terima === 'Pickup' ? feeFor(t, 'pickup', w) : 0, del = kembali === 'Delivery' ? feeFor(t, 'delivery', w) : 0;
  return { layanan, pick, del, total: layanan + pick + del };
}
const sumRows = (r, label = 'Total') => `<div class="sum">${r.map(x => `<div><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div>`;

/* ============================ MODAL ============================ */
function openModal(html, narrow) {
  closeModal();
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = `<div class="card modal${narrow ? ' narrow' : ''}" role="dialog" aria-modal="true" tabindex="-1"><button class="btn sm x" data-act="close" aria-label="Tutup">${ico('x')}</button>${html}</div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov); $('.modal', ov).focus(); return ov;
}
function closeModal() { const o = $('#ov'); if (o) o.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ============================ PENGIKAT EVENT ============================ */
const ACT = {}, FORMS = {};
document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) { if (a.tagName === 'A' && a.dataset.act !== 'x') e.preventDefault(); ACT[a.dataset.act](a, e); } });
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const btn = f.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
  try { await FORMS[f.dataset.form](f); } catch (err) { toast(err.message, true); } finally { if (btn) btn.disabled = false; }
});
document.addEventListener('input', e => { const f = e.target.closest('form[data-live]'); if (f && LIVE[f.dataset.live]) LIVE[f.dataset.live](f); });
const LIVE = {};
const fobj = f => { const o = Object.fromEntries(new FormData(f)); f.querySelectorAll('input[type=checkbox]').forEach(c => { o[c.name] = c.checked ? 'TRUE' : 'FALSE'; }); return o; };
const fld = (label, name, val = '', attrs = '', tag = 'input') => tag === 'textarea'
  ? `<label class="f"><span>${label}</span><textarea class="in" name="${name}" ${attrs}>${esc(val)}</textarea></label>`
  : `<label class="f"><span>${label}</span><input class="in" name="${name}" value="${esc(val)}" ${attrs}></label>`;
const sel = (label, name, opts, val = '', attrs = '') => `<label class="f"><span>${label}</span><select class="in" name="${name}" ${attrs}>${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select></label>`;

/* ============================ ROUTER ============================ */
async function route() {
  closeModal();
  const [p, a, b] = location.hash.replace(/^#\/?/, '').split('/');
  window.scrollTo(0, 0);
  if (p === 'admin') return adminRoute(a || '');
  const app = $('#app'); document.title = (S.info ? S.info.toko.nama_toko : 'Laundry');
  if (!S.info) {
    app.innerHTML = `<div class="wrap" style="padding-top:40px">${skeleton(3)}</div>`;
    try { S.info = await api('publicInfo'); document.title = S.info.toko.nama_toko; }
    catch (e) { app.innerHTML = `<div class="wrap" style="padding-top:40px"><div class="card err-box">${esc(e.message)}</div></div>`; return; }
  }
  const pages = { '': viewHome, pesan: viewPesan, status: () => viewStatus(a), harga: viewHome };
  app.innerHTML = buyerShell((pages[p] || viewHome)(), p);
  if (p === 'harga') $('#harga')?.scrollIntoView();
  if (p === 'pesan') { const lf = $('form[data-live=order]'); if (lf) LIVE.order(lf); }
  if (p === 'status' && a) { const f = $('form[data-form=track]'); if (f) f.noOrder.value = a; }
}

function notaHtml(o, t) {

    ${sumRows([[`${esc(o.Layanan)}<br><small>${kg(billed)} × ${rp(o.HargaPerKg)}${N(o.BeratAktual) ? '' : ' (estimasi)'}</small>`, rp(lay)],
      ...(N(o.BiayaTambahan) ? [['Biaya tambahan', rp(o.BiayaTambahan)]] : []), ...(o.MetodeTerima === 'Pickup' ? [['Jemput', N(o.BiayaPickup) ? rp(o.BiayaPickup) : 'Gratis']] : []),
      ...(o.MetodeKembali === 'Delivery' ? [['Antar', N(o.BiayaDelivery) ? rp(o.BiayaDelivery) : 'Gratis']] : []), ...(N(o.Diskon) ? [['Diskon', '-' + rp(o.Diskon)]] : [])])}<hr>
